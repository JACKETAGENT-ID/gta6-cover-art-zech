<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading Screen Comic — GTA-Style Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>LOADING SCREEN<br>COMIC</h1>
    <p class="tag">Turn your photo into a comic loading-screen cover. No upload — everything stays on your machine.</p>

    <fieldset class="photos">
      <legend>1 · Your photos</legend>
      <div class="slot" data-slot="A">
        <span class="slot-name">A</span>
        <img class="thumb" alt="Photo A preview">
        <label class="file-btn">Choose photo <input type="file" accept="image/*" data-photo="A" hidden></label>
        <button type="button" class="sample-btn" data-sample="A">Sample</button>
      </div>
      <div class="slot" data-slot="B">
        <span class="slot-name">B</span>
        <img class="thumb" alt="Photo B preview">
        <label class="file-btn">Choose photo <input type="file" accept="image/*" data-photo="B" hidden></label>
        <button type="button" class="sample-btn" data-sample="B">Sample</button>
      </div>
      <div class="slot" data-slot="C">
        <span class="slot-name">C</span>
        <img class="thumb" alt="Photo C preview">
        <label class="file-btn">Choose photo <input type="file" accept="image/*" data-photo="C" hidden></label>
        <button type="button" class="sample-btn" data-sample="C">Sample</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>2 · Panels</legend>
      <label>Layout
        <select id="layout">
          <option value="duo">Duo Diagonal — hero + street</option>
          <option value="triple">Triple Strip — three slashes</option>
          <option value="solo">Solo Hero — one big frame</option>
        </select>
      </label>
      <div class="panel-tabs" id="panelTabs" role="tablist" aria-label="Panels"></div>
      <label>Photo in this panel
        <select id="panelPhoto">
          <option value="A">Photo A</option>
          <option value="B">Photo B</option>
          <option value="C">Photo C</option>
        </select>
      </label>
      <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.01" value="1"></label>
      <label>Move left / right <input id="ox" type="range" min="-0.45" max="0.45" step="0.01" value="0"></label>
      <label>Move up / down <input id="oy" type="range" min="-0.45" max="0.45" step="0.01" value="0"></label>
      <p class="hint">Tip: drag the photo right on the preview to move it.</p>
    </fieldset>

    <fieldset>
      <legend>3 · Words</legend>
      <label>Caption <input id="caption" type="text" maxlength="48" value="SUNSET HEIST"></label>
      <label>Tagline <input id="tagline" type="text" maxlength="40" value="VICE CITY • 2026"></label>
      <label>Loading % <input id="loading" type="range" min="5" max="99" step="1" value="87"></label>
      <label class="check"><input id="halftone" type="checkbox" checked> Halftone dots</label>
    </fieldset>

    <fieldset>
      <legend>4 · Export</legend>
      <label>Post size
        <select id="size">
          <option value="1080x1080">Square — 1080 × 1080</option>
          <option value="1080x1350">Portrait — 1080 × 1350</option>
          <option value="1920x1080">Landscape — 1920 × 1080</option>
        </select>
      </label>
      <button id="export" type="button">EXPORT PNG</button>
      <p id="status" role="status"></p>
    </fieldset>
  </section>
  <section class="stage">
    <canvas id="preview" width="1080" height="1080" aria-label="Live cover preview"></canvas>
    <p class="stage-hint">Live preview — exactly what the PNG will look like.</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
